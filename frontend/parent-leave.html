<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>乘车请假</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f5f7fa;
      color: #303133;
    }
    .wrap {
      min-height: 100vh;
      padding: 18px;
    }
    .container {
      max-width: 720px;
      margin: 0 auto;
    }
    .page-title {
      margin: 0 0 10px;
      font-size: 24px;
      font-weight: 700;
    }
    .page-desc {
      margin: 0 0 18px;
      color: #606266;
      font-size: 14px;
      line-height: 1.6;
    }
    .card {
      background: #fff;
      border-radius: 14px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.06);
      padding: 18px;
      margin-bottom: 16px;
    }
    .card-title {
      margin: 0 0 14px;
      font-size: 18px;
      font-weight: 700;
      color: #303133;
    }
    .meta {
      margin: 6px 0;
      font-size: 14px;
      color: #606266;
      line-height: 1.6;
    }
    .field { margin-bottom: 16px; }
    .label {
      display: block;
      margin-bottom: 8px;
      font-size: 14px;
      font-weight: 600;
    }
    .input, .textarea, .select {
      width: 100%;
      border: 1px solid #dcdfe6;
      border-radius: 10px;
      padding: 12px 14px;
      font-size: 15px;
      outline: none;
      background: #fff;
    }
    .textarea {
      min-height: 96px;
      resize: vertical;
    }
    .input:focus, .textarea:focus, .select:focus {
      border-color: #409eff;
      box-shadow: 0 0 0 3px rgba(64,158,255,0.12);
    }
    .btn {
      width: 100%;
      border: 0;
      border-radius: 10px;
      padding: 13px 16px;
      font-size: 16px;
      font-weight: 600;
      color: #fff;
      background: #409eff;
      cursor: pointer;
    }
    .btn[disabled] {
      opacity: 0.65;
      cursor: not-allowed;
    }
    .msg {
      border-radius: 10px;
      padding: 12px 14px;
      font-size: 14px;
      line-height: 1.6;
      display: none;
      margin-bottom: 16px;
    }
    .msg.show { display: block; }
    .msg.success {
      background: #f0f9eb;
      color: #67c23a;
    }
    .msg.error {
      background: #fef0f0;
      color: #f56c6c;
    }
    .loading {
      color: #909399;
      font-size: 14px;
      text-align: center;
      padding: 20px 0;
    }
    .record-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .record-item {
      border-radius: 12px;
      border: 1px solid #ebeef5;
      padding: 14px;
      background: #fff;
    }
    .record-title {
      font-size: 15px;
      font-weight: 700;
      margin-bottom: 6px;
      color: #303133;
    }
    .record-meta {
      font-size: 13px;
      color: #606266;
      line-height: 1.7;
    }
    .hidden { display: none; }
    .student-switcher {
      margin-bottom: 16px;
      display: none;
    }
    .student-switcher.show { display: block; }
    .student-switcher .label {
      display: block;
      margin-bottom: 6px;
      font-size: 13px;
      font-weight: 600;
      color: #606266;
    }
    .student-switcher .select {
      width: 100%;
      max-width: 320px;
      border: 1px solid #dcdfe6;
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 15px;
      background: #fff;
      outline: none;
    }
    .student-switcher .select:focus {
      border-color: #409eff;
    }
    .link-btn {
      display: inline-block;
      margin-top: 12px;
      padding: 10px 14px;
      border-radius: 10px;
      background: #409eff;
      color: #fff;
      text-decoration: none;
      font-size: 14px;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="container">
      <h1 class="page-title">乘车请假</h1>
      <p class="page-desc">按日期和班次为学生提交请假，提交后即时生效。</p>

      <div id="studentSwitcher" class="student-switcher">
        <label class="label" for="studentSelect">切换学生</label>
        <select id="studentSelect" class="select"></select>
      </div>

      <div id="message" class="msg"></div>
      <div id="loading" class="loading">加载中...</div>

      <div id="content" class="hidden">
        <div class="card">
          <div class="card-title">学生信息</div>
          <div id="studentName" class="meta">-</div>
          <div id="studentGradeClass" class="meta">-</div>
          <div id="studentCardNo" class="meta">-</div>
        </div>

        <div class="card">
          <div class="card-title">提交请假</div>
          <form id="leaveForm">
            <div class="field">
              <label class="label" for="leaveDate">请假日期</label>
              <input id="leaveDate" class="input" type="date" />
            </div>
            <div class="field">
              <label class="label" for="sessionName">班次</label>
              <select id="sessionName" class="select">
                <option value="">加载班次中...</option>
              </select>
            </div>
            <div class="field">
              <label class="label" for="leaveReason">请假原因</label>
              <textarea id="leaveReason" class="textarea" placeholder="请输入请假原因（选填）"></textarea>
            </div>
            <button id="submitBtn" class="btn" type="submit">提交请假</button>
          </form>
        </div>

        <div class="card">
          <div class="card-title">最近请假记录</div>
          <div id="leaveList" class="record-list"></div>
        </div>
      </div>
    </div>
  </div>

  <script>
    // 无 openid 时自动跳转微信 OAuth 静默授权
    (function(){
      var p = new URLSearchParams(window.location.search);
      if (!p.get('openid') && !p.get('code')) {
        fetch('/api/wechat/app-id').then(function(r){ return r.json(); }).then(function(d){
          if (d.appId) {
            var redirectUri = encodeURIComponent(location.protocol + '//' + location.host + '/api/wechat/oauth-callback');
            var state = encodeURIComponent(location.pathname + location.search);
            location.href = 'https://open.weixin.qq.com/connect/oauth2/authorize?appid=' + d.appId + '&redirect_uri=' + redirectUri + '&response_type=code&scope=snsapi_base&state=' + state + '#wechat_redirect';
          }
        });
      }
    })();
    const params = new URLSearchParams(window.location.search);
    const openid = (params.get('openid') || '').trim();
    let currentStudentId = Number(params.get('student_id')) || null;

    const studentSwitcherEl = document.getElementById('studentSwitcher');
    const studentSelectEl = document.getElementById('studentSelect');
    const messageEl = document.getElementById('message');
    const loadingEl = document.getElementById('loading');
    const contentEl = document.getElementById('content');
    const studentNameEl = document.getElementById('studentName');
    const studentGradeClassEl = document.getElementById('studentGradeClass');
    const studentCardNoEl = document.getElementById('studentCardNo');
    const leaveListEl = document.getElementById('leaveList');
    const leaveForm = document.getElementById('leaveForm');
    const leaveDateEl = document.getElementById('leaveDate');
    const sessionNameEl = document.getElementById('sessionName');
    const leaveReasonEl = document.getElementById('leaveReason');
    const submitBtnEl = document.getElementById('submitBtn');
    let availableSessions = [];

    function showMessage(type, text, html) {
      messageEl.className = `msg show ${type}`;
      if (html) messageEl.innerHTML = text;
      else messageEl.textContent = text;
    }

    function hideMessage() {
      messageEl.className = 'msg';
      messageEl.textContent = '';
      messageEl.innerHTML = '';
    }

    function fmtDate(value) {
      if (!value) return '-';
      const date = new Date(value);
      if (Number.isNaN(date.getTime())) return String(value);
      return date.toLocaleDateString('zh-CN');
    }

    function fmtDateTime(value) {
      if (!value) return '-';
      const date = new Date(value);
      if (Number.isNaN(date.getTime())) return String(value);
      return date.toLocaleString('zh-CN', { hour12: false });
    }

    function buildStudentQsp() {
      const qs = `openid=${encodeURIComponent(openid)}`;
      return currentStudentId ? `${qs}&student_id=${currentStudentId}` : qs;
    }

    let allStudents = [];

    async function loadStudents() {
      if (!openid) return;
      try {
        const response = await fetch(`/api/wechat/parent-students?openid=${encodeURIComponent(openid)}`);
        const result = await response.json().catch(() => ({}));
        if (result.success && result.students?.length) {
          allStudents = result.students;
          if (allStudents.length > 1) {
            studentSwitcherEl.classList.add('show');
            studentSelectEl.innerHTML = allStudents.map(s =>
              `<option value="${s.id}"${s.id === currentStudentId ? ' selected' : ''}>${s.name} - ${[s.grade_name, s.class_name].filter(Boolean).join(' / ') || '未分班'}</option>`
            ).join('');
            studentSelectEl.addEventListener('change', () => {
              currentStudentId = Number(studentSelectEl.value) || null;
              loadLeavePage();
            });
          }
          if (!currentStudentId && allStudents.length > 0) {
            currentStudentId = allStudents[0].id;
          }
        }
      } catch {}
    }

    function renderSessions(sessions) {
      availableSessions = Array.isArray(sessions) ? sessions.filter(item => item && item.name) : [];
      const options = ['<option value="">请选择班次</option>']
        .concat(availableSessions.map(item => `<option value="${item.name}">${item.name}</option>`));
      sessionNameEl.innerHTML = options.join('');
      if (!availableSessions.length) {
        showMessage('error', '当前学生暂无已绑定班次，请先在平台完成学生班次绑定。');
      }
    }

    function renderLeaves(leaves) {
      if (!Array.isArray(leaves) || !leaves.length) {
        leaveListEl.innerHTML = '<div class="record-item"><div class="record-meta">暂无请假记录</div></div>';
        return;
      }

      leaveListEl.innerHTML = leaves.map(item => `
        <div class="record-item">
          <div class="record-title">${item.session_name || '班次请假'} / ${fmtDate(item.leave_date)}</div>
          <div class="record-meta">状态：${item.status || '-'}</div>
          <div class="record-meta">原因：${item.reason || '无'}</div>
          <div class="record-meta">提交时间：${fmtDateTime(item.created_at)}</div>
        </div>
      `).join('');
    }

    async function loadLeavePage() {
      if (!openid) {
        loadingEl.classList.add('hidden');
        showMessage('error', '缺少 openid，请从正确的微信链接进入。');
        return;
      }

      try {
        hideMessage();
        const response = await fetch(`/api/wechat/parent-leave?${buildStudentQsp()}`);
        const result = await response.json().catch(() => ({}));

        if (!response.ok || result.success === false) {
          loadingEl.classList.add('hidden');
          if (result.bound === false) {
            showMessage('error', `${result.message || '当前家长尚未绑定学生。'}<br><a class="link-btn" href="/bind-parent.html?openid=${encodeURIComponent(openid)}">前往绑定</a>`, true);
          } else {
            showMessage('error', result.message || '获取请假页面失败，请稍后重试。');
          }
          return;
        }

        studentNameEl.textContent = `学生姓名：${result.student?.name || '-'}`;
        studentGradeClassEl.textContent = `年级班级：${[result.student?.grade_name, result.student?.class_name].filter(Boolean).join(' / ') || '-'}`;
        studentCardNoEl.textContent = `学生卡号：${result.student?.card_no || '-'}`;
        renderSessions(result.sessions || []);
        renderLeaves(result.leaves || []);

        loadingEl.classList.add('hidden');
        contentEl.classList.remove('hidden');
      } catch (error) {
        loadingEl.classList.add('hidden');
        showMessage('error', '网络异常，请稍后重试。');
      }
    }

    leaveForm.addEventListener('submit', async (event) => {
      event.preventDefault();
      const leave_date = leaveDateEl.value;
      const session_name = sessionNameEl.value.trim();
      const reason = leaveReasonEl.value.trim();

      if (!leave_date || !session_name) {
        showMessage('error', '请完整选择请假日期和班次。');
        return;
      }

      if (!availableSessions.some(item => item.name === session_name)) {
        showMessage('error', '请选择学生已绑定的真实班次名称。');
        return;
      }

      submitBtnEl.disabled = true;
      submitBtnEl.textContent = '提交中...';

      try {
        const response = await fetch('/api/wechat/parent-leave', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ openid, student_id: currentStudentId || undefined, leave_date, session_name, reason })
        });
        const result = await response.json().catch(() => ({}));

        if (!response.ok || result.success === false) {
          showMessage('error', result.message || '提交请假失败，请稍后重试。');
          return;
        }

        showMessage('success', result.message || '请假已提交成功');
        leaveForm.reset();
        await loadLeavePage();
      } catch (error) {
        showMessage('error', '网络异常，请稍后重试。');
      } finally {
        submitBtnEl.disabled = false;
        submitBtnEl.textContent = '提交请假';
      }
    });

    async function init() {
      await loadStudents();
      await loadLeavePage();
    }

    init();
  </script>
</body>
</html>
